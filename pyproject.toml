[project]
name = "forge"
version = "0.1.0"
description = "Modular Agent Platform (Forge)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "pydantic-settings>=2.5.2",
    "PyJWT>=2.9.0",
    "httpx>=0.27.2",
    "langfuse>=2.51.0",
    "litellm>=1.49.0",
    "openhands-sdk==1.24.0",
    "openhands-tools==1.24.0",
    "openhands-workspace==1.24.0",
    "openhands-agent-server==1.24.0",
    "sentence-transformers>=3.1.1",
    "celery[redis]>=5.4.0",
    "mcp>=2.2.0",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.13",
    "fastmcp>=4.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "smoke: Fast smoke test suite for CI (<2 min)",
    "unit: Isolated unit tests (no network, no LLM)",
    "integration: Integration tests requiring compose stack",
    "eval: Evaluation and benchmark tests",
]
