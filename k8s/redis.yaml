apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
    spec:
      containers:
      - name: redis
        image: redis:7
        command: ["redis-server", "--maxmemory-policy", "noeviction"]
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
spec:
  selector:
    app: redis-cache
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-stream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-stream
  template:
    metadata:
      labels:
        app: redis-stream
    spec:
      containers:
      - name: redis
        image: redis:7
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-stream
spec:
  selector:
    app: redis-stream
  ports:
    - protocol: TCP
      port: 6380
      targetPort: 6379
