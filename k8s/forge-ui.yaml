apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forge-ui
  template:
    metadata:
      labels:
        app: forge-ui
    spec:
      containers:
      - name: forge-ui
        image: forge-ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: forge-ui
spec:
  type: NodePort
  selector:
    app: forge-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
