apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forge-api
  template:
    metadata:
      labels:
        app: forge-api
    spec:
      containers:
      - name: forge-api
        image: forge-api:latest
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://forge:forge_password@postgres:5432/forge"
        - name: REDIS_URL
          value: "redis://redis-cache:6379/0"
        - name: SMTP_HOST
          value: "mailpit"
        - name: SMTP_PORT
          value: "1025"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: forge-api
spec:
  type: NodePort
  selector:
    app: forge-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
