name: CI Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy backend/

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit & detect-secrets
        run: pip install pip-audit detect-secrets

      - name: Run pip-audit for dependency vulnerability scan (REQ-055)
        run: pip-audit || echo "Audit completed with findings"

      - name: Check for secrets with detect-secrets (REQ-056)
        run: |
          if [ -f .secrets.baseline ]; then
            detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
          else
            detect-secrets scan > .secrets.baseline
          fi

  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Run Unit Tests & Fast Smoke Tier (REQ-047)
        run: uv run pytest tests/unit -v
